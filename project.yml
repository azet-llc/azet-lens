name: Mwoyea
options:
  bundleIdPrefix: dev.midagedev
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  MwoyeaCore:
    path: Core
targets:
  Mwoyea:
    type: application
    platform: macOS
    sources:
      - path: App
      # Built by tools/inpaint/convert_migan.sh; the app falls back to flat fill without it.
      - path: tools/inpaint/models/MIGAN_512.mlpackage
        optional: true
    dependencies:
      - package: MwoyeaCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mwoyea
        CFBundleName: Mwoyea
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 midagedev"
        NSScreenCaptureUsageDescription: "Mwoyea reads the text inside the screen areas you choose so it can translate it in place."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.midagedev.mwoyea
        PRODUCT_NAME: Mwoyea
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: $(MWOYEA_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(MWOYEA_TEAM)
        PROVISIONING_PROFILE_SPECIFIER: ""
        OTHER_CODE_SIGN_FLAGS: --timestamp=none
        CODE_SIGN_ENTITLEMENTS: App/Mwoyea.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        DEAD_CODE_STRIPPING: YES
        COREML_CODEGEN_LANGUAGE: None

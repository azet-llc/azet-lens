name: Stats

# Once a day (and after each release): usage numbers from the release files' download counts → the `stats` branch,
# which the README's badges read.
on:
  schedule:
    - cron: "17 0 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency: stats

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: stats
          path: stats
      - name: Count
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/stats.py stats
      - name: Publish
        working-directory: stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "stats $(date -u +%F)"
          git push

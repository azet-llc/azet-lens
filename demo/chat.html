<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>#general — Pixel Pals</title>
<style>
  :root { color-scheme: dark; --bg: #313338; --side: #2b2d31; --rail: #1e1f22; --text: #dbdee1; --muted: #949ba4; --line: #3f4147; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "gg sans", "Helvetica Neue", "Segoe UI", sans-serif; overflow: hidden; }
  .app { display: grid; grid-template-columns: 72px 240px 1fr; height: 100%; }
  .rail { background: var(--rail); display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 12px; }
  .rail div { width: 48px; height: 48px; border-radius: 16px; background: #5865f2; }
  .rail div:nth-child(2) { background: #23a55a; border-radius: 50%; } .rail div:nth-child(3) { background: #f0b232; border-radius: 50%; }
  .side { background: var(--side); padding: 14px 10px; }
  .side h2 { font-size: 16px; margin: 4px 8px 18px; color: #f2f3f5; }
  .side p { margin: 2px 0; padding: 6px 8px; border-radius: 4px; color: var(--muted); font-size: 15px; }
  .side p.on { background: #404249; color: #f2f3f5; }
  .main { display: flex; flex-direction: column; min-width: 0; }
  header { height: 48px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #26272b; font-weight: 600; color: #f2f3f5; }
  header span { color: var(--muted); font-weight: 400; margin-left: 12px; font-size: 14px; }
  #log { flex: 1; overflow-y: auto; padding: 16px 0 8px; scroll-behavior: smooth; }
  .msg { display: grid; grid-template-columns: 56px 1fr; padding: 6px 16px 6px 8px; }
  .msg:hover { background: #2e3035; }
  .av { width: 40px; height: 40px; border-radius: 50%; margin: 2px 0 0 8px; }
  .who { font-weight: 600; font-size: 16px; } .who time { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 8px; }
  .body { font-size: 16px; line-height: 1.45; margin-top: 2px; }
  .new { animation: pop .35s ease-out; } @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  footer { padding: 0 16px 24px; } footer div { background: #383a40; border-radius: 8px; padding: 12px 16px; color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <nav class="rail"><div></div><div></div><div></div></nav>
  <aside class="side">
    <h2>Pixel Pals</h2>
    <p># announcements</p><p class="on"># general</p><p># speedrunning</p><p># fan-art</p><p># memes</p><p>🔊 Lounge</p>
  </aside>
  <section class="main">
    <header># general <span>Talk about anything. Be nice.</span></header>
    <div id="log"></div>
    <footer><div>Message #general</div></footer>
  </section>
</div>
<script>
const people = { maya: ["Maya", "#f47b67"], jun: ["junpark", "#58a6ff"], ollie: ["Ollie 🌙", "#c27cff"], sam: ["samwise", "#3ba55d"], rin: ["rinrin", "#f0b232"] };
const script = [
  ["maya", "ok who stayed up for the patch notes last night"],
  ["jun", "guilty. they finally fixed the double jump bug, I can't believe it took three months"],
  ["ollie", "wait does that mean the skip in world 4 is dead?? I spent all weekend learning it"],
  ["sam", "lol rip. honestly the skip was kind of broken anyway"],
  ["rin", "Is anyone doing the co-op event tonight? I need two more people for the raid"],
  ["maya", "I'm in! what time are you thinking"],
  ["rin", "Around 9 my time, so like an hour from now?"],
  ["jun", "count me in too, just let me finish dinner first"],
  ["ollie", "Has anyone tried the new fishing spot behind the lighthouse? Someone on Reddit said you can catch a golden carp there at night"],
  ["sam", "that thread was wild, half the comments were people saying it's fake and the other half posting screenshots"],
  ["maya", "I caught one yesterday!! took me like forty minutes but it's real"],
  ["rin", "Okay that settles it, we're going fishing after the raid"],
  ["jun", "the devs replied on the subreddit btw, they said more secret spots are coming in the next update"],
  ["ollie", "this is the best community I've ever been part of, no joke"],
  ["sam", "don't get sappy on us now ollie"],
  ["maya", "too late, I'm already emotional"],
  ["rin", "Raid starts in five minutes, everyone grab your gear!"],
];
const log = document.getElementById("log");
let i = 0, minute = 12;
function add(animate) {
  const [who, text] = script[i % script.length];
  const [name, color] = people[who];
  const el = document.createElement("div");
  el.className = "msg" + (animate ? " new" : "");
  el.innerHTML = `<div class="av" style="background:${color}"></div><div><div class="who" style="color:${color}">${name}<time>Today at 8:${String(minute).padStart(2, "0")} PM</time></div><div class="body"></div></div>`;
  el.querySelector(".body").textContent = text;
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  log.appendChild(el);
  i++; minute = Math.min(59, minute + 1);
  if (atBottom) log.scrollTop = log.scrollHeight; // like Discord: stay put while reading back
}
const params = new URLSearchParams(location.search);
for (let k = 0; k < Number(params.get("history") || 10); k++) add(false);
const every = Number(params.get("every") || 4);
if (every > 0) setInterval(() => add(true), every * 1000);
// ?scroll=t1:px,t2:px — at t seconds, scroll the log smoothly by px (negative = up), for scripted recordings.
for (const step of (params.get("scroll") || "").split(",").filter(Boolean)) {
  const [t, px] = step.split(":").map(Number);
  setTimeout(() => log.scrollBy({ top: px, behavior: "smooth" }), t * 1000);
}
</script>
</body>
</html>
